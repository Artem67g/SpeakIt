  <circle cx="86" cy="196" r="48" fill="#7b4a2b"/>
  <circle cx="86" cy="196" r="29" fill="#e9b48a"/>
  <circle cx="314" cy="196" r="48" fill="#7b4a2b"/>
  <circle cx="314" cy="196" r="29" fill="#e9b48a"/>
  <!-- head and tuft -->
  <path d="M184 84 Q192 58 206 80 Q214 60 224 86 Z" fill="#7b4a2b"/>
  <ellipse cx="200" cy="206" rx="122" ry="126" fill="#8d5733"/>
